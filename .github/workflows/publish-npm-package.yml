name: Publish Npm Package

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/*'

# The built-in GITHUB_TOKEN pushes the release tag and the gh-pages branch;
# the old GH_TOKEN PAT expired and is no longer needed.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Node 24 is the release baseline. chromedriver >= 120 (installed below
        # to match the runner's Chrome) requires Node 18+. The python2 build
        # moved from the "prepublish" lifecycle hook to an explicit step: the
        # jsunit pages load the gitignored blockly_uncompressed_*.js, so the
        # check must generate them before testing.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python 2.7
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2.7 python2.7-dev python2-pip-whl
          sudo ln -sf python2.7 /usr/bin/python
          export PYTHONPATH=`echo /usr/share/python-wheels/pip-*py2*.whl`
          sudo --preserve-env=PYTHONPATH python -m pip install --upgrade pip setuptools wheel
          sudo chown -R $USER /usr/local/lib/python2.7

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - run: npm ci

      - name: Build blockly artifacts
        run: |
          set -o pipefail
          npm run build:blockly 2>&1 | tee /tmp/build.log || {
            echo "::error title=build:blockly::$(tail -c 2500 /tmp/build.log | tr '\n' '  ')"
            exit 1
          }

      - name: Set test env
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d '.' -f 1)
          npm install --save-dev chromedriver@$CHROME_MAJOR_VERSION
          export DISPLAY=:99.0
          tests/scripts/setup_linux_env.sh
          sleep 2

      - name: Lint
        run: npm run test:lint

      - name: Message tests
        run: |
          set -o pipefail
          npm run test:messages 2>&1 | tee /tmp/messages.log || {
            echo "::error title=test:messages::$(tail -c 700 /tmp/messages.log | tr '\n' '  ')"
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/unit.log || {
            echo "::error title=test:unit::$(tail -c 2500 /tmp/unit.log | tr '\n' '  ')"
            exit 1
          }

  publish:
    needs: check
    runs-on: ubuntu-22.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up Python 2.7
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2.7 python2.7-dev python2-pip-whl
          sudo ln -sf python2.7 /usr/bin/python
          export PYTHONPATH=`echo /usr/share/python-wheels/pip-*py2*.whl`
          sudo --preserve-env=PYTHONPATH python -m pip install --upgrade pip setuptools wheel
          sudo chown -R $USER /usr/local/lib/python2.7

      - run: npm ci

      # Translations live in this repo (hxblock-l10n) and are maintained by
      # hand; the old "openblock-l10n@latest + Transifex pull + commit back"
      # steps would overwrite them with upstream content, so they were removed.
      # Tests already ran in the check job for this same commit.

      - name: Get package main version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.1.0

      - name: Generate release version
        run: |
          echo "RELEASE_VERSION=${{ steps.package-version.outputs.current-version }}-prerelease.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Set package version
        run: npm --no-git-tag-version version $RELEASE_VERSION

      - name: Tag release
        # Only tag when the version will actually reach npm.
        if: env.NPM_TOKEN != ''
        run: |
          git tag $RELEASE_VERSION
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY $RELEASE_VERSION

      - name: Deploy with gh-pages
        run: |
          set -o pipefail
          {
            # Drop the read-only credential header injected by actions/checkout
            # so git relies on the URL credentials below (the same
            # x-access-token form the tag push uses successfully).
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "$REPO_URL"
            git config --get remote.origin.url | sed 's/:[^@/]*@/:***@/'
            git apply gh-pages/patch
            npm run build
            npm run deploy -- -u "github-actions-bot <support+actions@github.com>" -r "$REPO_URL"
          } 2>&1 | tee /tmp/deploy.log || {
            echo "::error title=deploy::$(tail -c 2500 /tmp/deploy.log | tr '\n' '  ')"
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # webpack 4 needs the legacy md4 hash on Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider

      # Publishing is skipped until an NPM_TOKEN secret is configured;
      # releases are done manually with npm publish in the meantime.
      - uses: JS-DevTools/npm-publish@v1
        if: env.NPM_TOKEN != ''
        with:
          token: ${{ secrets.NPM_TOKEN }}

