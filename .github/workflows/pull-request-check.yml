name: Pull Request Check

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Node 24 is the release baseline. chromedriver >= 120 (installed below
        # to match the runner's Chrome) requires Node 18+. The python2 build
        # was moved from the "prepublish" lifecycle hook to an explicit "build"
        # script, so npm ci needs no python2 here; tests run against the
        # generated artifacts committed in the repo.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Set test env
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d '.' -f 1)
          npm install --save-dev chromedriver@$CHROME_MAJOR_VERSION
          export DISPLAY=:99.0
          tests/scripts/setup_linux_env.sh
          sleep 2

      - name: Lint
        run: npm run test:lint

      - name: Message tests
        run: |
          set -o pipefail
          npm run test:messages 2>&1 | tee /tmp/messages.log || {
            echo "::error title=test:messages::$(tail -c 700 /tmp/messages.log | tr '\n' '  ')"
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/unit.log || {
            echo "::error title=test:unit::$(tail -c 2500 /tmp/unit.log | tr '\n' '  ')"
            exit 1
          }
